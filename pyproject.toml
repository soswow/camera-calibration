[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-calibration"
version = "0.1.0"
description = "ChArUco and checkerboard camera calibration helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python>=4.7",
    "numpy>=1.23",
    "Pillow>=10.0",
    "reportlab>=3.6",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
camera-calibration = "camera_calibration.cli.main:main"

[tool.setuptools.packages.find]
include = ["camera_calibration*"]
